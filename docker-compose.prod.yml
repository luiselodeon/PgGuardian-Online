# =====================================================================
# PgGuardian — Docker Compose de Producción / PoC AWS EC2 (RF-03)
#
# Levanta 5 servicios: proxy (Caddy), frontend (nginx), api (FastAPI
# sin --reload), app_db y sandbox_db. Únicamente Caddy expone 80 y 443.
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
# =====================================================================

# Política común de rotación de logs (RF-04.2 / T-02 / CA-10):
# máx. 3 archivos × 10 MB = 30 MB por contenedor, 150 MB para los cinco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: caddy:2-alpine
    container_name: pgguardian_proxy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public_net
    depends_on:
      - api
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: pgguardian_frontend_prod
    restart: unless-stopped
    logging: *logging
    networks:
      - public_net
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: pgguardian_api_prod
    restart: unless-stopped
    logging: *logging
    # RF-04.3 / T-03 / CA-11: suma api + app_db + sandbox_db = 1408 MiB,
    # deja >= 600 MiB de los 2048 MiB de la t3.small para SO y Docker.
    mem_limit: 512m
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_DB_HOST: app_db
      APP_DB_PORT: 5432
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SANDBOX_DB_HOST: sandbox_db
      SANDBOX_DB_PORT: 5432
      SANDBOX_DB_NAME: ${SANDBOX_DB_NAME}
      SANDBOX_DB_ADMIN_USER: ${SANDBOX_DB_ADMIN_USER}
      SANDBOX_DB_ADMIN_PASSWORD: ${SANDBOX_DB_ADMIN_PASSWORD}
      SANDBOX_DB_EXEC_USER: ${SANDBOX_DB_EXEC_USER}
      SANDBOX_DB_EXEC_PASSWORD: ${SANDBOX_DB_EXEC_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    networks:
      - public_net
      - app_net
      - sandbox_net
    depends_on:
      app_db:
        condition: service_healthy
      sandbox_db:
        condition: service_healthy

  app_db:
    image: postgres:16
    container_name: pgguardian_appdb_prod
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - app_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  sandbox_db:
    image: postgres:16
    container_name: pgguardian_sandboxdb_prod
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${SANDBOX_DB_NAME}
      POSTGRES_USER: ${SANDBOX_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${SANDBOX_DB_ADMIN_PASSWORD}
    # RF-04.4 / T-04 / CA-12: datos en el disco EBS propio del sandbox.
    # En producción SANDBOX_DATA_DIR=/srv/sandbox/pgdata; en local se usa
    # ./.data/sandbox. create_host_path: false hace que Docker se niegue a
    # iniciar sandbox_db si el directorio no existe (p. ej. disco no
    # montado) en lugar de crearlo en el disco raíz. Es la protección real,
    # porque restart: unless-stopped levanta el contenedor sin pasar por systemd.
    volumes:
      - type: bind
        source: ${SANDBOX_DATA_DIR:-./.data/sandbox}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SANDBOX_DB_ADMIN_USER} -d ${SANDBOX_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  public_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
  sandbox_net:
    driver: bridge
    internal: true

volumes:
  app_data:
    name: pgguardian_app_data
  caddy_data:
    name: pgguardian_caddy_data
  caddy_config:
    name: pgguardian_caddy_config

